name: Build CineFlow Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract CineFlow ZIP automatically
        run: |
          ls -la
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z"
          done
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          echo "Found package.json at: $PKG_PATH"
          if [ -n "$PKG_PATH" ] && [ "$PKG_PATH" != "./package.json" ]; then
            cp -rf "$(dirname "$PKG_PATH")"/* .
          fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies and generate Android project
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/android --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Accept SDK licenses and build Debug APK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-ai-studio-pro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
